# Harmonised status category (owner decision 2026-11-20; docs/snapshots-v2.md, "Status category").
#
# Each record keeps its register's own word in legalStatus, untouched (Article 4.3). The snapshot adds
# statusCategory, one of config/labels.yaml legal_status, mapped here per source. The site shows both;
# its status filter, facets and dashboards use the category.
#
# sources: <source id in config/sources.yaml>: {<category>: [<register word>, ...]}
#   Words match case-insensitively, with spaces trimmed and runs of spaces read as one.
#   A word ending in * matches every word starting with it (the longest such prefix wins; an exact word
#   always wins over a prefix).
#   Checked when read: every category must be in labels.yaml legal_status, every source must be in
#   sources.yaml, and no word may be mapped to two categories.
# A record with no status word gets unknown. A word not listed here gets unknown too, and is counted in
# the day's manifest (stats.unmappedStatus, "<source>: <word>"), so it can be added here.
# Judgement calls (see the PR that added this file): a company still on the register while in
# administration, receivership, a voluntary arrangement or restructuring, or with a strike-off only
# proposed, is active (GLEIF's convention: ACTIVE until the entity ceases to exist).

version: 1

sources:
  gleif:
    active: [ACTIVE]
    inactive: [INACTIVE]
    unknown: ["NULL"]

  gb-coh:
    active:
      - Active
      - Active - Proposal to Strike off
      - In Administration
      - Administration Order
      - In Administration/Administrative Receiver
      - In Administration/Receiver Manager
      - Administrative Receiver
      - Receivership
      - Receiver Action
      - Receiver Manager / Administrative Receiver
      - Live but Receiver Manager on at least one charge
      - Voluntary Arrangement
      - Voluntary Arrangement / Administrative Receiver
      - Voluntary Arrangement / Receiver Manager
    in-liquidation: [Liquidation]
    dissolved: [Dissolved]
    inactive: [Converted/Closed, Closed]
    struck-off: [Removed]

  us-ny-dos:
    active: [Active]           # the dataset lists active corporations only

  us-or-sos:
    active: [Active]           # the dataset lists active businesses only

  us-co-sos:
    active: [Good Standing, Exists, "Delinquent*", "Noncompliant*", Registered Agent Resigned]
    dissolved: [Voluntarily Dissolved, Administratively Dissolved, Judicially Dissolved, Dissolved,
                Dissolved (Term Expired)]
    struck-off: [Revoked]
    merged: [Merged, Consolidated]
    inactive: [Withdrawn, Expired, Effectiveness Prevented]
    unknown: [Converted]

  us-ct-sots:
    active: [Active, Pending Withdrawal]
    dissolved: [Dissolved]
    struck-off: [Forfeited, Revoked]
    merged: [Merged, Consolidated, Consolidation]
    inactive: [Withdrawn, Cancelled, Inactive, Surrendered, Renunciated, Converted Out]
    unknown: [Converted, Domesticated, Redomesticated]   # into or out of Connecticut: unclear from the word alone

  br-rfb-cnpj:                 # lc_ingest.receita translates the code: 01 Null, 02 Active, 03 Suspended, 04 Unfit, 08 Closed
    active: [Active, ATIVA]
    inactive: [Suspended, SUSPENSA, Unfit, INAPTA, "Null", NULA]
    dissolved: [Closed, BAIXADA]

  sg-acra:
    active: [Live, Live Company, Registered, "Live (*"]
    in-liquidation: ["In Liquidation*"]
    dissolved: ["Dissolved*"]
    struck-off: ["Struck Off*", "Gazetted to be Struck Off*"]
    merged: [Amalgamated]
    inactive: [Cancelled, "Cancelled (*", Ceased Registration, Terminated, Expired, Withdrawn, Suspended,
               Registration expired and has not been renewed]
    unknown: ["Converted*"]

  fi-prh:                      # no current situation means Active (lc_ingest.bulk.fi_record)
    active: [Active, Restructuring, "Restructuring*", Corporate restructuring]
    in-liquidation: [In liquidation, Liquidation, "Liquidation*", Bankruptcy, Bankrupt, "Bankruptcy*"]

  ie-cro:
    active: [Normal, Strike Off Listed, Receivership, Examinership, Examination]
    in-liquidation: [Liquidation]
    dissolved: [Dissolved, Dissolved-20 years]
    struck-off: [Struck Off]
    merged: [Amalgamated, Dissolved PostMerger, Deleted CB Merger]
    inactive: [Deregistered, Closed, Ceased, Ceased IRL, De-Registered ICAV]
    unknown: [Converted, "Conv. to*"]

  us-irs-eo-bmf:               # lc_ingest.bulk.IRS_STATUS spells out the IRS's exemption status codes
    active: [Unconditional exemption, Conditional exemption, Trust described in 4947(a)(2),
             Terminating private foundation status]

  au-abr-abn:                  # lc_ingest.bulk.ABN_STATUS spells out the ABN's status codes
    active: [Active]
    inactive: [Cancelled]

  fr-rna:                      # lc_ingest.bulk.RNA_POSITION spells out the RNA's position codes
    active: [Active]
    dissolved: [Dissolved]
    inactive: [Deleted]

  ar-rns: {}                   # the register publishes no status word: its records get unknown

  tw-mof-tax:                  # the dataset lists operating businesses only
    active: [Operating]

  cy-drcor:                    # the register's own Greek words (registered, reminder sent, struck off, ...)
    # Words seen in the trial (2026-W48), with and without accents: the map matches letters exactly.
    active:
      - Εγγεγραμμένη                       # registered
      - Στάληκε επιστολή Υπενθύμισης        # reminder letter sent
      - Δημοσιεύτηκε η Τρίμηνη              # three-month strike-off notice published (only proposed: active)
      - Υπο Διαχείριση                      # under administration (still on the register: active)
      - Ευρωπαϊκή Εταιρεία                  # European company (SE) on the register
    struck-off:
      - Διαγραμμ*                           # struck off
      - Αφαιρέθηκε από το Μητρώο*           # removed from the register (by court decision)
    dissolved:
      - Διαλυ*
      - Διάλυσ*                             # dissolved on completing (voluntary) liquidation
    merged:
      - Διαλύθηκε λόγω συγχώνευσης          # dissolved by merger
    in-liquidation:
      - Υπό Εκκαθάριση*
      - Υπο Εκκαθάριση                      # in liquidation (unaccented)
      - Υπο Διαχείριση & Υπο Εκκαθάριση     # under administration and in liquidation
      - Εκούσια Εκκαθάριση*                 # voluntary liquidation (by members or creditors)
      - Εκκαθάριση με Διάταγμα Δικαστηρίου*  # liquidation by court order
      - Διορισμός Προσωρινού Εκκαθαριστή    # provisional liquidator appointed

  si-ajpes-prs:                # lc_ingest.bulk_batch3: only deleted units carry a word
    dissolved: [Deleted]

  nl-anbi:                     # the list holds current public-benefit institutions
    active: [ANBI]

  gb-oscr:
    active: [Active, Not Submitted, Not Monitored]
    inactive: [Removed]

  ca-cra-charities:            # the list holds registered charities
    active: [Registered]

  pe-sunat-ruc:                # SUNAT's taxpayer states, as SUNAT documents them; the trial counts any other word
    active: [ACTIVO]
    inactive:
      - SUSPENSION TEMPORAL            # temporarily suspended activity
      - BAJA PROVISIONAL               # provisional deregistration
      - BAJA PROV. POR OFICIO          # provisional deregistration by SUNAT
    struck-off:
      - BAJA DEFINITIVA                # final deregistration
      - BAJA DE OFICIO                 # deregistered by SUNAT

  us-cms-nppes-org:            # lc_ingest.bulk_batch3: deactivated unless reactivated since
    active: [Active]
    inactive: [Deactivated]

  gb-ccew:
    active: [Registered]
    inactive: [Removed]

  au-asic:                     # lc_ingest.bulk.AU_STATUS spells out ASIC's codes
    active: [Registered, Strike-off action in progress]
    dissolved: [Deregistered, Dissolved]
    inactive: [Not active, Cancelled]
    unknown: [External administration]

  jp-nta:                      # lc_ingest.nta: Active, or Closed with its cause
    active: [Active]
    dissolved: ["Closed: liquidation completed", "Closed: other liquidation completed"]
    merged: ["Closed: dissolved by merger"]
    struck-off: [Closed by the registrar]
    inactive: [Closed, "Closed:*"]

  ca-ised:
    active: [Active, "Dissolution Pending*"]
    dissolved: ["Dissolved*"]
    merged: [Amalgamated, Inactive - Amalgamated]
    inactive: [Inactive, Discontinued, Inactive - Discontinued, "Inactive -*"]
