# Sources. Changes adding a source are Tier 2; changes to access/credentials are Tier 3.
# access:
#   open          - public bulk file or keyless API
#   owner-key     - needs a credential the owner creates and enters in the console
#   web-discovery - no registry access; build from public web pages
# status: active | awaiting-owner | disabled
# url / terms_url: where the data is published, and its licence or terms.
# assessment: Claude's reading of the terms, for the owner's review. Not legal advice;
#   verified: false until the owner (or counsel) has checked it.
#   risk: low | medium | high | unknown
# approval: the starting status before any owner decision: approved | pending (default).
#   The owner approves, denies or keeps pending on the Data sources page (admin area,
#   fresh second-factor code); those decisions override this. Only approved sources are
#   fetched, and only approved sources' records reach the snapshot, database and site.
# Owner edits: on the Data sources page the owner can add a source, edit its attributes
#   (name, country, url, terms_url, licence, access, method, cadence, assessment, verified),
#   remove one that isn't built and isn't approved, and leave Claude a suggestion (1,000
#   characters). They are kept in the control bucket (source-edits.json, lc_core.source_edits)
#   and laid over this file for the page and the owner's actions; jobs, the snapshot and
#   approvals read only this file. id, approval and pipeline can only change here.
#   When an edit should become permanent, copy it here and clear it there.
# pipeline: present once a source is built and running in the daily cycle. The site's
#   System page and the status views are drawn from these entries, so adding a source
#   here (with its job and store) is all they need.
#   stage: trial or production (owner, 2026-11-22; docs/source-trials.md). Only a new source (or a completely
#   changed one, as a second pipeline) is on trial: its job, production's own image, only measures its data's
#   quality and keeps a small report (trials/<source>/, the "quality" event in status.yml, the admin Trials
#   tab); the snapshot leaves it out. It moves to production once, by a pull request changing this field,
#   approved by the owner on the admin page, and is never measured again.
#   job: Cloud Run job; store: prefix in the data bucket; records_as: the id records carry;
#   label: the name shown everywhere; refresh: how often the source publishes something new;
#   dataset: the dataset's name in the snapshot's NOTICE; attribution: the credit the licence asks
#   for (empty if none); role: register (default) or lei (GLEIF): registers' values win in a
#   merge, so LEI sources come last; relationships: an extra store of relationships, if any;
#   image: the shared image the job runs, when several sources share one (ingest-socrata);
#   record_url: where the source shows one record, with {registrationNumber}, {lei} or {directoryId}
#   (optional; records without one link to the dataset, url). Every record carries its source URL
#   (registryUrl), and the snapshot and database carry each source's licence, attribution and a
#   citation (owner requirement 2026-11-16).
#   The daily cycle's steps (Terraform), the snapshot, the site and the workflows all read these.
# volume_guard: read by every ingestion job (lc_core.guard; checked, so a bad value stops a run before it
#   fetches anything). A publication that would change more than max_fraction of a store's existing records
#   is held, unless the store has fewer than minimum records.
#   mapping_upgrades: one-time exceptions the owner approved, when a mapping gains a field and one
#   publication changes most records at once. Each names the source (its id here), the one publication key
#   (as the job names it: New York's is the ISO week, e.g. 2026-W48), the reason, approved_by: owner and
#   approved_on. Only that publication goes through past the guard, logged as a mapping-upgrade decision;
#   any other still trips. Remove an entry once its publication is processed.
# gleif_identity: how a GLEIF record's registration authority and number become the key of a register we
#   read directly, so a company with an LEI and its register record mint one directory ID and merge
#   (lc_core.gleif_identity; checked when read; owner decision 2026-11-20). Per GLEIF code:
#   registry: the code the register's own records are minted under (default: the same code);
#   country: the register's country (default: the record's address country);
#   number: rules applied in order (strip-leading-zeros, jp-corporate-number). A number a rule doesn't fit
#   is minted as GLEIF writes it, under GLEIF's own code. An authority not listed mints as GLEIF writes it.
#   Changing this section re-keys the stored GLEIF records once (ingest-gleif, event gleif-rekeyed): a record
#   whose ID changes leaves a tombstone at its old ID, labelled merged:<new ID> (docs/snapshots-v2.md).
#   The re-key is held by volume_guard like any publication; its key for mapping_upgrades is
#   "rekey <fingerprint>" (the fingerprint is in the held event).

version: 1

volume_guard:
  max_fraction: 0.1
  minimum: 100
  mapping_upgrades:
    - source: us-ny-dos
      publish: 2026-W48
      reason: >-
        New York records gain the company's street address (location_address_1 and _2; c/o lines dropped),
        so every record with one changes once. Owner decisions 2026-11-16 and 2026-11-20.
      approved_by: owner
      approved_on: "2026-11-20"

# trials: a source on trial that fails on this many separate days, with no successful run between, is marked
#   invalid with the date and the reason, and its job stops. The owner can re-approve it on the admin Data sources
#   tab; it then gets the same number of days again. Owner decision 2026-11-22 (lc_core.validity,
#   docs/source-trials.md).
trials:
  invalid_after_failed_days: 3

gleif_identity:
  RA000585: {registry: GB-COH, country: GB, note: "Companies House, England and Wales"}
  RA000586: {registry: GB-COH, country: GB, note: "Companies House, Northern Ireland"}
  RA000587: {registry: GB-COH, country: GB, note: "Companies House, Scotland"}
  # Oregon's register writes numbers without leading zeros; GLEIF keeps them ("057491-14" is 5749114 there,
  # "2125331-94" is 212533194 in both). Checked against data.oregon.gov, 2026-11-20.
  RA000631: {country: US, number: [strip-leading-zeros], note: "Oregon Secretary of State"}
  # Corporations Canada's numbers include the check digit and no leading zeros; GLEIF keeps the zeros
  # ("046311-6" is 463116 there). Checked against the register's active files, 2026-11-20.
  RA000072: {country: CA, number: [strip-leading-zeros], note: "Corporations Canada"}
  # GLEIF files Norwegian organisation numbers under both codes for the Brønnøysund register.
  RA000472: {country: "NO", note: "Brønnøysund Register Centre"}
  RA000473: {registry: RA000472, country: "NO", note: "Brønnøysund Register Centre (second code)"}
  # The commercial registration number (会社法人等番号, 12 digits) is the corporate number without its check
  # digit; jp-nta mints with RA001075 and the 13-digit corporate number.
  RA001075: {country: JP, note: "Japan corporate number (National Tax Agency)"}
  RA000412: {registry: RA001075, country: JP, number: [jp-corporate-number], note: "Japan commercial registration"}

sources:
  - id: gleif
    name: GLEIF golden copy (LEI-CDF, RR-CDF)
    country: "*"
    access: open
    method: bulk
    licence: CC0-1.0
    cadence: daily
    status: active
    url: https://www.gleif.org/en/lei-data/gleif-golden-copy
    terms_url: https://www.gleif.org/en/meta/lei-data-terms-of-use
    assessment:
      risk: low
      commercial: allowed
      attribution: not required (GLEIF asks for it as good practice)
      summary: >-
        LEI data is published under CC0 1.0: no copyright restrictions, free for any use including
        commercial redistribution. GLEIF's terms disclaim accuracy and ask that the data not be
        presented as GLEIF's own service.
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    pipeline: {stage: production, job: ingest-gleif, store: gleif, records_as: gleif, label: GLEIF, refresh: new files daily, relationships: gleif-rr,
               role: lei, dataset: GLEIF LEI golden copy, attribution: "", record_url: "https://search.gleif.org/#/record/{lei}"}

  - id: gb-coh
    name: UK Companies House
    country: GB
    access: open
    method: bulk           # monthly basic company data
    licence: OGL-UK-3.0 (unconfirmed)
    cadence: monthly
    status: active
    url: https://download.companieshouse.gov.uk/en_output.html
    terms_url: https://www.gov.uk/guidance/companies-house-data-products
    assessment:
      risk: medium
      commercial: allowed (widely reused commercially)
      attribution: expected if OGL applies ("Contains public sector information licensed under the Open Government Licence v3.0")
      summary: >-
        The Free Company Data Product is free to download and is widely redistributed. Its licence
        is not stated on the download page. A 2014 Companies House FOI answer said it was not
        published under the Open Government Licence; later third-party sources say OGL v3.0 applies.
        Worth written confirmation from Companies House before going public. The file holds no
        officer data; the care-of column is never read.
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    upgrade:
      access: owner-key    # streaming API for daily changes
      secret: sources/gb-coh/api-key
      status: awaiting-owner
    pipeline: {stage: production, job: ingest-gb, store: gb, records_as: gb-coh, label: Companies House, refresh: monthly register,
               dataset: Companies House basic company data,
               record_url: "https://find-and-update.company-information.service.gov.uk/company/{registrationNumber}",
               attribution: "Contains public sector information licensed under the Open Government Licence v3.0."}

