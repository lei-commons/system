  - id: br-rfb-cnpj
    name: Receita Federal CNPJ open data
    country: BR
    access: open
    method: bulk
    licence: to-be-verified
    cadence: monthly
    status: active
    url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/cadastros/consultas/dados-publicos-cnpj
    terms_url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/lgpd/termo-de-uso
    assessment:
      risk: medium
      commercial: likely allowed (Brazil's open data policy); not confirmed for this dataset
      attribution: expected (credit Receita Federal)
      summary: >-
        Published monthly as open data under Brazil's open data policy, and widely reused. No
        dataset-specific licence was found; the Receita Federal website itself is CC BY-ND 3.0, which
        may not be meant for the data. The files hold personal data (individual entrepreneurs, MEI,
        partners' names and contact details); we drop all natural persons and never read contact
        columns, which also matters under the LGPD. Worth confirming the terms before going public.
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    pipeline: {job: ingest-br, store: br, records_as: br-rfb, label: Receita Federal, refresh: monthly release}

  - id: in-mca
    name: India Ministry of Corporate Affairs
    country: IN
    access: owner-key
    method: api
    secret: sources/in-mca/credentials
    status: awaiting-owner
    fallback: web-discovery
    url: https://www.mca.gov.in
    terms_url: https://www.mca.gov.in
    assessment: {risk: unknown, commercial: unknown, attribution: unknown, summary: "Needs MCA access arranged by the owner; terms depend on the access route.", verified: false}

  - id: sg-acra
    name: Singapore ACRA (data.gov.sg)
    country: SG
    access: open
    method: bulk
    licence: SG-Open-Data-1.0
    cadence: monthly
    status: active
    url: https://data.gov.sg/collections/2/view
    terms_url: https://data.gov.sg/open-data-licence
    assessment:
      risk: low
      commercial: allowed
      attribution: required (name the dataset and source, link the licence)
      summary: >-
        Singapore Open Data Licence v1.0: free to use, adapt and redistribute, including commercially,
        with attribution and without implying endorsement. Singapore law governs; the licence can be
        updated, and continued use accepts the new version. Sole proprietorships and partnerships are
        dropped (they are people's business names).
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    pipeline: {job: ingest-sg, store: sg, records_as: sg-acra, label: ACRA Singapore, refresh: monthly}

  - id: web
    name: Public web discovery (entity websites, schema.org, Common Crawl)
    country: "*"
    access: web-discovery
    method: crawl
    licence: per-page
    status: active
    url: https://commoncrawl.org
    terms_url: https://commoncrawl.org/terms-of-use
    assessment: {risk: high, commercial: varies by page, attribution: varies by page, summary: "Not built yet. Each page has its own terms; Common Crawl's terms of use apply to its archive. Needs a careful review before any use.", verified: false}
