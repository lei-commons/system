# Sources. Changes adding a source are Tier 2; changes to access/credentials are Tier 3.
# access:
#   open          - public bulk file or keyless API
#   owner-key     - needs a credential the owner creates and enters in the console
#   web-discovery - no registry access; build from public web pages
# status: active | awaiting-owner | disabled
# url / terms_url: where the data is published, and its licence or terms.
# assessment: Claude's reading of the terms, for the owner's review. Not legal advice;
#   verified: false until the owner (or counsel) has checked it.
#   risk: low | medium | high | unknown
# approval: the starting status before any owner decision: approved | pending (default).
#   The owner approves, denies or keeps pending on the Data sources page (owner console,
#   fresh second-factor code); those decisions override this. Only approved sources are
#   fetched, and only approved sources' records reach the snapshot, database and site.
# pipeline: present once a source is built and running in the daily cycle. The site's
#   System page and the status views are drawn from these entries, so adding a source
#   here (with its job and store) is all they need.
#   job: Cloud Run job; store: prefix in the data bucket; records_as: the id records carry;
#   label: short name; refresh: how often the source publishes something new;
#   relationships: an extra store of relationships, if any.

version: 1

sources:
  - id: gleif
    name: GLEIF golden copy (LEI-CDF, RR-CDF)
    country: "*"
    access: open
    method: bulk
    licence: CC0-1.0
    cadence: daily
    status: active
    url: https://www.gleif.org/en/lei-data/gleif-golden-copy
    terms_url: https://www.gleif.org/en/meta/lei-data-terms-of-use
    assessment:
      risk: low
      commercial: allowed
      attribution: not required (GLEIF asks for it as good practice)
      summary: >-
        LEI data is published under CC0 1.0: no copyright restrictions, free for any use including
        commercial redistribution. GLEIF's terms disclaim accuracy and ask that the data not be
        presented as GLEIF's own service.
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    pipeline: {job: ingest-gleif, store: gleif, records_as: gleif, label: GLEIF, refresh: new files daily, relationships: gleif-rr}

  - id: gb-coh
    name: UK Companies House
    country: GB
    access: open
    method: bulk           # monthly basic company data
    licence: OGL-UK-3.0 (unconfirmed)
    cadence: monthly
    status: active
    url: https://download.companieshouse.gov.uk/en_output.html
    terms_url: https://www.gov.uk/guidance/companies-house-data-products
    assessment:
      risk: medium
      commercial: allowed (widely reused commercially)
      attribution: expected if OGL applies ("Contains public sector information licensed under the Open Government Licence v3.0")
      summary: >-
        The Free Company Data Product is free to download and is widely redistributed. Its licence
        is not stated on the download page. A 2014 Companies House FOI answer said it was not
        published under the Open Government Licence; later third-party sources say OGL v3.0 applies.
        Worth written confirmation from Companies House before going public. The file holds no
        officer data; the care-of column is never read.
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    upgrade:
      access: owner-key    # streaming API for daily changes
      secret: sources/gb-coh/api-key
      status: awaiting-owner
    pipeline: {job: ingest-gb, store: gb, records_as: gb-coh, label: Companies House, refresh: monthly register}

  - id: us-ny-dos
    name: New York Department of State (open data)
    country: US
    access: open
    method: api
    licence: OPEN-NY terms of use
    cadence: weekly
    status: active
    url: https://data.ny.gov/Economic-Development/Active-Corporations-Beginning-1800/n9v6-gdp6
    terms_url: https://ny.github.io/open-data-handbook/publicuse.html
    assessment:
      risk: low
      commercial: allowed
      attribution: not required
      summary: >-
        New York State publishes under its own OPEN-NY terms rather than a Creative Commons licence.
        Reported as permissive: no attribution or share-alike requirement and no ban on commercial use,
        but users agree to hold the State harmless (indemnification). Individual datasets can add terms;
        this one lists none. Only non-personal columns are requested (no agents, chairmen or process
        addresses).
      verified: false
    approval: approved
    approved_by: owner
    approved_at: "2026-11-11"
    approval_note: In use before the approvals page; approved by the owner on 2026-11-11.
    pipeline: {job: ingest-ny, store: us-ny, records_as: us-ny-dos, label: New York DOS, refresh: weekly}

