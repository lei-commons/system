    country: US
    access: open
    method: api
    licence: none stated (Oregon open data law)
    cadence: weekly
    status: active
    url: https://data.oregon.gov/Business/Active-Businesses-ALL/tckn-sxa6
    terms_url: https://oregon.public.law/statutes/ors_276A.356
    assessment:
      risk: medium
      commercial: likely allowed (Oregon's open data standard calls for no restrictions on use); not stated for this dataset
      attribution: not stated (credit the Oregon Secretary of State as good practice)
      summary: >-
        "Active Businesses - ALL" on data.oregon.gov (Corporation Division, weekly) states no licence. ORS 276A.356
        asks that the state's publishable data be available without registration, licence requirements or
        restrictions on use. About 453,000 active businesses. The dataset lists one row per associated name
        (registered agents, representatives); the query asks for one row per business with only its principal
        place of business's city, state and ZIP, so no person's name or address is downloaded. Assumed business
        names (often people) and name reservations are dropped. GLEIF writes Oregon numbers with a two-digit
        suffix ("115676-17") the dataset lacks, so about 1,600 Oregon companies with an LEI don't merge yet.
      verified: false
    pipeline: {job: ingest-or, image: ingest-socrata, store: us-or, records_as: us-or-sos, label: Oregon Secretary of State, refresh: weekly,
               dataset: "Active Businesses - ALL (data.oregon.gov)",
