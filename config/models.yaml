# Model routing. Protected path (Tier 3).
# All calls go through Vertex AI. Batch wherever latency allows (50% discount).
# Checker must come from a different vendor than the maker for Tier 2.

version: 1

endpoints:
  gemini: {location: us-central1}
  claude: {location: global}
  open:   {location: us-central1}

tasks:
  extract_entity_page:
    maker:   {vendor: gemini, model: gemini-flash, mode: batch}
    checker: {vendor: claude, model: claude-haiku, mode: batch}
  resolve_residual_pair:
    maker:   {vendor: gemini, model: gemini-flash, mode: batch}
    checker: {vendor: claude, model: claude-sonnet, mode: batch}
  tier2_judge:
    judges:
      - {vendor: gemini, model: gemini-pro}
      - {vendor: claude, model: claude-sonnet}
  code_change:
    maker:   {vendor: claude, model: claude-opus, mode: online}
    checker: {vendor: gemini, model: gemini-pro, mode: online}
  # The web-asserted facts pilot (services/web_claims; owner approval 2026-11-23). Online calls: the pilot is
  # small and runs in the daily cycle. Gemini 3.x models are served from Vertex AI's global location.
  web_claims:
    maker:   {vendor: claude, model: claude-haiku, mode: online, location: global}
    checker: {vendor: gemini, model: gemini-flash, mode: online, location: global}
  translit_names:
    maker:   {vendor: open, model: open-small, mode: batch}

# Model classes above, as Vertex AI model IDs (the newest of each class; updated here, never in code).
model_ids:
  claude-haiku: claude-haiku-5-5
  claude-sonnet: claude-sonnet-5-5
  claude-opus: claude-opus-5-5
  gemini-flash: gemini-3.5-flash

# Approximate list prices, USD per million tokens (input, output), for the pilot's own spend estimate and cap.
# The budget guard and the owner's monthly budget remain the hard limits.
prices_usd_per_mtok:
  claude-haiku: [0.10, 0.50]
  gemini-flash: [0.50, 3.00]

limits:
  max_daily_model_usd: 40   # soft; hard limit is the owner's monthly budget
