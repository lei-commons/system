# Egress allow-list for registry/API traffic through the conduct-policy proxy.
# Protected path. Adding a host needs owner approval in the console (Article 2).
# Web discovery uses a separate crawler profile: any public host, robots.txt honoured,
# 1 req/s per host, GET/HEAD only, no cookies, no form posts, no auth headers.

version: 1

registry_hosts:
  - api.gleif.org
  - goldencopy.gleif.org
  - leidata-preview.gleif.org
  - download.companieshouse.gov.uk
  - data.ny.gov
  - data.colorado.gov
  - data.oregon.gov
  - data.ct.gov
  # Owner approved 2026-11-16 for Ireland's CRO open data (source ie-cro):
  # opendata.cro.ie redirects the download to a signed link on its object storage.
  - opendata.cro.ie
  - nl-ams-1.linodeobjects.com
  # Owner approved 2026-11-16 for Finland's PRH open data (source fi-prh):
  - avoindata.prh.fi
  # Owner approved 2026-11-16 for the ASIC company dataset (source au-asic):
  - data.gov.au
  # Owner approved 2026-11-16 for Canada's federal corporations (source ca-ised):
  # open.canada.ca's dataset links its files on ISED's CloudFront distribution.
  - d4bf66bykfyaf.cloudfront.net
  - www.dos.pa.gov
  - dadosabertos.rfb.gov.br
  - arquivos.receitafederal.gov.br
  - data.gov.sg
  - api-production.data.gov.sg
  # Owner approved 2026-11-22 with the sources (system PR "sources batch 1", approved on /admin):
  # the IRS EO BMF extract (us-irs-eo-bmf) and the Charity Commission's register extract on its Azure blob (gb-ccew).
  - www.irs.gov
  - ccewuksprdoneregsadata1.blob.core.windows.net
  # Owner approved 2026-11-22 with the sources (system PR "sources batch 2", approved on /admin): France's RNA
  # (fr-rna: data.gouv.fr's catalogue, files on the Interior ministry's media host), Argentina's RNS (ar-rns) and
  # Taiwan's tax registrations (tw-mof-tax). The ABN extract (au-abr-abn) is on data.gov.au, already listed.
  - www.data.gouv.fr
  - media.interieur.gouv.fr
  - datos.jus.gob.ar
  - eip.fia.gov.tw
  # Owner approved 2026-11-09 for the ACRA datasets: data.gov.sg starts a download at
  # api-open and serves the file from a signed S3 link in its Singapore region.
  - api-open.data.gov.sg
  - s3.ap-southeast-1.amazonaws.com
  - index.commoncrawl.org
  - data.commoncrawl.org

owner_key_hosts:
  # Enabled only when the owner has entered and approved a credential for the source.
  - {host: api.company-information.service.gov.uk, source: gb-coh}
  - {host: stream.companieshouse.gov.uk, source: gb-coh}

model_hosts:
  - us-central1-aiplatform.googleapis.com
  - aiplatform.googleapis.com

# How the registry hosts above are asked (owner decision 2026-11-18): at a person's pace in a web browser,
# never continuously. Much stricter than Article 2.4's one request per second. Per host: one request at a
# time (the next waits until the last has finished, whole download included), then a pause of
# min_seconds_between_requests plus a random 0 to extra_random_seconds, so requests don't come like
# clockwork. After a 403, 429 or 5xx (or a failed connection) the host is left alone for
# seconds_after_an_error, or its Retry-After if longer (up to an hour), so a retry never hammers a site
# that is refusing us. A request waits up to max_queue_seconds for its turn, then gets 429 with the time
# to come back (the job's gateway client waits and tries again).
pacing:
  one_request_at_a_time: true
  min_seconds_between_requests: 5
  extra_random_seconds: 10
  seconds_after_an_error: 120
  max_queue_seconds: 900

# Official sources whose public data is offered only through a web page or form: no login, no CAPTCHA,
# nothing behind an access control (Article 2.1). They are fetched by a real browser (lc_browser) whose
# every request still comes through this gateway: allow-list, robots.txt, pacing, the fixed address, an
# honest User-Agent. Approved by the owner per host and source; the browser profile allows GET, HEAD and
# form POSTs and passes the site's own session cookies both ways, never credentials, never login paths.
# Never a way around a refusal: a site that blocks us is asked to allow us instead.
browser_hosts:
  # Owner approved 2026-11-16: the narrow exception for Japan's NTA corporate-number download form
  # (one-time token and session cookie), given per-record attribution (done, #84/#88).
  - {host: www.houjin-bangou.nta.go.jp, source: jp-nta, approved: "owner 2026-11-16"}
  # Owner approved 2026-11-19: browser fallback (docs/browser-downloads.md) when the regular download fails
  # consistently, even after retries, and never around a refusal. These hosts stay registry hosts for the
  # regular download; the browser profile applies only to the browser's own requests.
  - {host: opendata.cro.ie, source: ie-cro, approved: "owner 2026-11-19 (browser fallback)"}
  - {host: nl-ams-1.linodeobjects.com, source: ie-cro, approved: "owner 2026-11-19 (browser fallback)"}
  - {host: data.gov.au, source: au-asic, approved: "owner 2026-11-19 (browser fallback)"}

browser_policy:
  honour_robots_txt: true
  # Appended to the browser's own User-Agent, so every request names us.
  user_agent: "lei-commons-browser/0.1 (+https://github.com/lei-commons)"
  # Within a page (its scripts, the form post) requests come a little closer than registry downloads; the
  # human think time between steps (5-15 s) is the flow's own. Still one request at a time per host.
  pacing:
    one_request_at_a_time: true
    min_seconds_between_requests: 1
    extra_random_seconds: 2
    seconds_after_an_error: 120
    max_queue_seconds: 900

crawler_policy:
  methods: [GET, HEAD]
  max_rps_per_host: 1
  honour_robots_txt: true
  send_cookies: false
  send_auth_headers: false
  user_agent: "lei-commons-crawler/0.1 (+https://github.com/lei-commons)"
  deny_paths_matching:
    - "(?i)/(login|signin|sign-in|account|admin|wp-admin|checkout|cart)(/|$)"
