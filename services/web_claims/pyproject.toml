[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-web-claims"
version = "0.1.0"
description = "The web-asserted facts pilot: Common Crawl pages, match evidence, maker and checker models (measure-only)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
# also needs lc-core and lc-ingest (its trials module), installed from packages/
dependencies = ["pyyaml>=6", "pyarrow>=15", "google-cloud-storage>=2.16", "google-auth[requests]>=2.29"]

[project.optional-dependencies]
models = ["anthropic[vertex]>=0.70"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["web_claims*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
