[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-ingest-socrata"
version = "0.1.0"
description = "US state registers on Socrata portals (Colorado, Oregon, Connecticut)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["google-cloud-storage>=2.16"]  # also needs lc-core and lc-ingest

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ingest_socrata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
