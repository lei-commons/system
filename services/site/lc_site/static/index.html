<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lei-commons</title>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-mark"></span>lei-commons</a>
  <!-- data-area="admin": pages of the admin area (/admin/), which asks for a recent 2-step sign-in first. They
       show only to an admin (app.js asks /api/v1/me); hidden until then. -->
  <nav class="nav" id="nav">
    <a href="#/" data-route="search">Search</a>
    <a href="#/graph" data-route="graph">Graph explorer</a>
    <a href="#/dashboards" data-route="dashboards">Dashboards</a>
    <a href="#/data" data-route="data">Data</a>
    <a href="#/sources" data-route="sources" data-area="admin">Data sources</a>
    <a href="#/trials" data-route="trials" data-area="admin">Trials</a>
    <a href="#/system" data-route="system" data-area="admin">System</a>
    <a href="#/log" data-route="log" data-area="admin">Log</a>
    <a href="#/approvals" data-route="approvals" data-area="admin">Approvals</a>
    <a href="#/security" data-route="security" data-area="admin">Second factor</a>
  </nav>
  <span class="spacer"></span>
  <span class="private admin-badge" id="admin-badge" hidden title="The admin area: every change needs a fresh code from your authenticator">Admin</span>
  <span class="private" title="Visible only to the owner until the owner approves going public">Private</span>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="view"></main>
<footer>Private test instance, visible only to the owner. lei-commons is an independent open directory,
not affiliated with GLEIF, and does not issue LEIs.</footer>
</body>
</html>
