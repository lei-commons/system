[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-load-db"
version = "0.1.0"
description = "Loads each snapshot into the serving database"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["google-cloud-storage>=2.16", "google-cloud-secret-manager>=2.20"]  # also needs lc-core and lc-directory

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["load_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
