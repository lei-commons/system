[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-ingest"
version = "0.1.0"
description = "Turns source records into allow-listed records and ledger changes"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6"]  # also needs lc-core, installed from packages/lc_core

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lc_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
