[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-browser"
version = "0.1.0"
description = "Downloads from official sources whose public data is offered only through a web page or form, with a real browser whose every request goes through the conduct gateway"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["cryptography>=42"]  # also needs lc-core; the runner needs playwright (installed in the image)

[project.optional-dependencies]
browser = ["playwright>=1.48"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lc_browser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
