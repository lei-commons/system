[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-directory"
version = "0.1.0"
description = "The serving database: schema, loader and queries, shared by the loader job and the site"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lc_directory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
