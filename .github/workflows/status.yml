# Health at a glance, for checking without the owner.
# The system repo's logs are public, so this prints states, times and aggregate counts, never records.
name: status

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Daily cycle, last five runs
        run: gcloud workflows executions list daily-cycle --location "$REGION" --limit 5 --format='table(name.basename(),state,startTime,endTime)' || true
      - name: Jobs, last execution of each
        run: |
          for job in ingest-gleif ingest-gb ingest-br ingest-ny ingest-sg build-snapshot load-db egress-check; do
            gcloud run jobs executions list --job "$job" --region "$REGION" --limit 3 \
              --format="table[no-heading](\"$job\",metadata.name,status.completionTime,status.conditions[0].type,status.conditions[0].status)" || true
          done
      - name: What each job's last run recorded (event names and aggregate counts only)
        run: |
          for job in ingest-gleif ingest-gb ingest-br ingest-ny ingest-sg build-snapshot load-db; do
            execution=$(gcloud run jobs executions list --job "$job" --region "$REGION" --limit 1 --format='value(metadata.name)') || continue
            echo "== $job $execution"
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$job\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\" AND jsonPayload.event:*" \
              --order=asc --limit=50 --format=json \
              | jq -c '.[].jsonPayload | {event, source, publish, date, records, total, changes, new_records, existing_changed, relationships, seconds, days, day, events, absent, count, companies, natural_persons_dropped, next, error} | with_entries(select(.value != null))' || true
            # The end of a traceback, if the run crashed: exception types and code lines, never records.
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$job\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\" AND textPayload:*" \
              --order=desc --limit=8 --format='value(textPayload)' | tac | cut -c1-200 || true
          done
      - name: Schedules
        run: gcloud scheduler jobs list --location "$REGION" --format='table(name.basename(),schedule,state,lastAttemptTime,status.code)' || true
      - name: Services
        run: gcloud run services list --region "$REGION" --format='table(metadata.name,status.conditions[0].status,status.latestReadyRevisionName)' || true
