# Health at a glance, for checking without the owner.
# The system repo's logs are public, so this prints states, times and aggregate counts, never records.
name: status

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config/sources.yaml
          sparse-checkout-cone-mode: false
      - name: The cycle's jobs, from the sources registry
        run: |
          pip install -q pyyaml
          python3 -c "import yaml; s = yaml.safe_load(open('config/sources.yaml'))['sources']; print('CYCLE_JOBS=' + ' '.join([x['pipeline']['job'] for x in s if x.get('pipeline')] + ['build-snapshot', 'load-db', 'dedi-check']))" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Daily cycle, last five runs
        run: gcloud workflows executions list daily-cycle --location "$REGION" --limit 5 --format='table(name.basename(),state,startTime,endTime)' || true
      - name: Daily cycle's deployed steps (compare with the registry above; a missing job means a bootstrap rerun is due)
        run: |
          gcloud workflows describe daily-cycle --location "$REGION" --format='value(sourceContents)' \
            | grep -oE '(ingest-[a-z0-9-]+|build-snapshot|load-db)' | awk '!seen[$0]++' | tr '\n' ' ' || true
          echo
      - name: Bucket lifecycle rules (actions and ages only)
        run: |
          for b in snapshots data; do
            printf '%s: ' "$b"
            gcloud storage buckets describe "gs://${{ vars.GCP_PROJECT_ID }}-$b" --format=json 2>/dev/null \
              | jq -c '[.lifecycle_config.rule[]? | {action: .action.type, age: .condition.age, noncurrentDays: .condition.daysSinceNoncurrentTime, prefix: .condition.matchesPrefix}]' \
              || echo "not readable by this identity"
          done
      - name: Jobs, last execution of each
        run: |
          for job in $CYCLE_JOBS egress-check; do
            gcloud run jobs executions list --job "$job" --region "$REGION" --limit 3 \
              --format="table[no-heading](\"$job\",metadata.name,status.completionTime,status.conditions[0].type,status.conditions[0].status)" || true
          done
      - name: What each job's runs of the last 22 hours recorded (event names and aggregate counts only)
        run: |
          # Every execution of the last 22 hours (a retried source shows its failed try too), else the latest.
          since=$(date -u -d '22 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          for job in $CYCLE_JOBS; do
            executions=$(gcloud run jobs executions list --job "$job" --region "$REGION" --limit 6 \
              --filter="metadata.creationTimestamp>=$since" --sort-by=metadata.creationTimestamp --format='value(metadata.name)') || continue
            [ -n "$executions" ] || executions=$(gcloud run jobs executions list --job "$job" --region "$REGION" --limit 1 --format='value(metadata.name)') || continue
            for execution in $executions; do
            echo "== $job $execution"
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$job\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\" AND jsonPayload.event:*" \
              --order=asc --limit=50 --format=json \
              | jq -c '.[].jsonPayload | {event, source, publish, date, records, total, changes, new_records, existing_changed, relationships, seconds, days, day, events, absent, count, companies, natural_persons_dropped, next, error, copy_entities_s, copy_relationships_s, apply_changes_s, indexes_s, vacuum_s, stats_s, swap_s, kind, why, mode, anchor, base, from, parts, files, added, changed, deleted, relationshipsAdded, relationshipsChanged, relationshipsDeleted, uploaded, reused, bytes, apply_s, check_s, days_kept, days_deleted, parts_deleted, parts_kept, bytes_deleted, states_deleted, dry_run, attempt, attempts, reason, ok, repaired, kid, problems, previous_s, build_s, read_s, rows_s, leaf_s, parts_s, diff_s, relationships_s, finish_s, upload_s, prune_s, dedi_s, total_s, rules, moved, movedByAuthority, tombstones, thereAlready, keptApart, relabelled} | with_entries(select(.value != null))' || true
            # The end of a traceback, if the run crashed: exception types and code lines, never records.
            gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$job\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\" AND textPayload:*" \
              --order=desc --limit=8 --format='value(textPayload)' | tac | cut -c1-200 || true
            done
          done
      - name: The site's owner-action events (event names and error types only)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="lei-commons-site" AND jsonPayload.event:*' \
            --freshness=2d --order=desc --limit=30 --format=json \
            | jq -c '.[] | {time: .timestamp[0:19], revision: .resource.labels.revision_name} + (.jsonPayload | {event, action, status, error})
                     | with_entries(select(.value != null))' || true
      - name: The site's recent POST requests and errors (status, latency, method and path only)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="lei-commons-site" AND httpRequest.requestMethod="POST"' \
            --freshness=2d --order=desc --limit=15 --format=json \
            | jq -c '.[] | {time: .timestamp[0:19], status: .httpRequest.status, latency: .httpRequest.latency, path: (.httpRequest.requestUrl | sub("^https?://[^/]+"; ""))}' || true
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="lei-commons-site" AND (severity>=ERROR OR textPayload:"Traceback" OR textPayload:"Error")' \
            --freshness=2d --order=desc --limit=20 --format='value(timestamp,textPayload)' | cut -c1-220 || true
      - name: Schedules
        run: gcloud scheduler jobs list --location "$REGION" --format='table(name.basename(),schedule,state,lastAttemptTime,status.code)' || true
      - name: Services
        run: gcloud run services list --region "$REGION" --format='table(metadata.name,status.conditions[0].status,status.latestReadyRevisionName)' || true
      - name: Cloud NAT for the gateway, last 24 hours (dropped connections, counts only)
        run: |
          gcloud logging read 'resource.type="nat_gateway" AND jsonPayload.allocation_status="DROPPED"' --freshness=1d \
            --limit 1000 --format=json | jq -c '{dropped: length, latest: (.[0].timestamp // null)}' || true
      - name: The gateway's way out (network and egress setting; lc-egress means the one fixed address)
        run: |
          gcloud run services describe conduct-gateway --region "$REGION" --format=json \
            | jq -c '.spec.template.metadata.annotations | {network: (."run.googleapis.com/network-interfaces" // "none: shared Cloud Run addresses"), egress: ."run.googleapis.com/vpc-access-egress"}' || true
