# Every change to the system goes into the decision log (owner, 2026-11-22): each merge into main, and each
# deploy once it finishes (done, failed or stopped). scripts/record_change.py writes one chained event per
# change into gs://<project>-decision-log/runs/<day>/, sealed into the day's chain the next morning with the
# jobs' decisions and the owner's actions. Recording never blocks anything. The log shows object names only,
# because this repository's logs are public.
name: changes

on:
  push:
    branches: [main]
  workflow_run:
    # Every deploy workflow (scripts/tests/test_record_change.py checks that none is missing).
    workflows: [deploy-budget-guard, deploy-build-snapshot, deploy-cycle, deploy-gateway,
                deploy-ingest-br, deploy-ingest-browser, deploy-ingest-bulk, deploy-ingest-gb, deploy-ingest-gleif,
                deploy-ingest-ny, deploy-ingest-sg, deploy-ingest-socrata, deploy-load-db, deploy-site]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # a deploy's commit may be a few behind main; a merge needs its parent for the file count
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Record the change
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EVENT: ${{ github.event_name }}
          DEPLOY: ${{ github.event.workflow_run.name }}
          RUN_OUTCOME: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = "push" ]; then
            python3 scripts/record_change.py merge
          else
            GITHUB_SHA="$RUN_SHA" GITHUB_RUN_ID="$RUN_ID" OUTCOME="$RUN_OUTCOME" \
              python3 scripts/record_change.py deploy "${DEPLOY#deploy-}"
          fi
