# Builds the conduct gateway image and rolls it out to the gateway and the
# egress-check job, then proves the network again. The deployer identity can
# do this from system@main only.
name: deploy-gateway

on:
  push:
    branches: [main]
    paths: ["services/conduct_proxy/**", "packages/lc_core/**", "config/egress-allowlist.yaml", ".github/workflows/deploy-gateway.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lei-commons/conduct-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy only while the system is running (the owner's control state)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          STATE_CHECK_ENFORCED: ${{ vars.STATE_CHECK_ENFORCED }}
        run: python3 scripts/check_system_state.py deploy:gateway
      - name: Build and push
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f services/conduct_proxy/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Roll out
        run: |
          gcloud run services update conduct-gateway --region "${{ vars.GCP_REGION }}" --image "$IMAGE:$GITHUB_SHA"
          gcloud run jobs update egress-check --region "${{ vars.GCP_REGION }}" --image "$IMAGE:$GITHUB_SHA"
      # The first check right after a rollout has failed several times (2026-11-22, 2026-11-23 04:30 UTC)
      # while later checks and the next cycles passed: the new revision needs a moment. Up to 3 tries, 90 s apart;
      # each failed try prints the check's own lines (check name, ok, detail), so the log says which check failed.
      - name: Prove the network again
        run: |
          for attempt in 1 2 3; do
            if gcloud run jobs execute egress-check --region "${{ vars.GCP_REGION }}" --wait; then
              echo "egress-check passed on try $attempt"
              exit 0
            fi
            echo "::warning::egress-check failed on try $attempt"
            gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="egress-check" AND textPayload:"check"' \
              --freshness=10m --limit 20 --format='value(textPayload)' || true
            if [ "$attempt" -lt 3 ]; then sleep 90; fi
          done
          echo "::error::egress-check failed 3 times after the rollout"
          exit 1
