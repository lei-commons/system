# Builds the GLEIF ingestion job and deploys it on the sealed jobs network,
# then runs it once. While the system is paused the run stops at its first
# check, which proves the job is wired up without fetching anything.
name: deploy-ingest-gleif

on:
  push:
    branches: [main]
    paths: ["services/ingest_gleif/**", "packages/lc_ingest/**", "packages/lc_core/**", "config/fields.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ingest-gleif
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lei-commons/ingest-gleif

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f services/ingest_gleif/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy the job
        run: |
          GATEWAY="$(gcloud run services describe conduct-gateway --region "$REGION" --format='value(status.url)')"
          gcloud run jobs deploy ingest-gleif --region "$REGION" --image "$IMAGE:$GITHUB_SHA" \
            --service-account "lc-ingest@$PROJECT.iam.gserviceaccount.com" \
            --network lc-jobs --subnet "lc-jobs-$REGION" --vpc-egress all-traffic \
            --set-env-vars "LC_GATEWAY_URL=$GATEWAY,LC_DATA_BUCKET=$PROJECT-data,LC_CONTROL_STATE_URI=gs://$PROJECT-control/state.json" \
            --max-retries 0 --task-timeout 3600 --memory 2Gi
      - name: Run once (stops at the control gate while paused)
        run: gcloud run jobs execute ingest-gleif --region "$REGION" --wait
