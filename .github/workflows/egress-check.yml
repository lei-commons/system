# Proves the network from the inside on a schedule, so nobody has to run it by hand.
# It uses the deployer identity, which is limited to system@main.
name: egress-check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: egress-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run the check inside the jobs network
        run: gcloud run jobs execute egress-check --region "${{ vars.GCP_REGION }}" --wait
