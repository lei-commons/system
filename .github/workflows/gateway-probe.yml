# One polite request through the conduct gateway, to see how a source answers us (status, headers, and
# for an error the start of its explanation). Runs the ingest-gleif job with its arguments overridden
# (python -m ingest_gleif.probe <url>): the same sealed network, identity, gateway, pacing and fixed
# address as every fetch. First kilobyte only; nothing is stored. The gateway still refuses any host
# that isn't allow-listed. Never near 02:00 UTC.
name: gateway-probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "https URL on an allow-listed registry host"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: gateway-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGION: ${{ vars.GCP_REGION }}
      URL: ${{ inputs.url }}
    steps:
      - name: Check the URL
        run: |
          echo "$URL" | grep -Eq '^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~%/?=&+-]*)?$' || { echo "::error::not a plain https URL"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Probe through the gateway
        run: |
          execution=$(gcloud run jobs execute ingest-gleif --region "$REGION" --wait \
            --args="python,-m,ingest_gleif.probe,$URL" --format='value(metadata.name)')
          echo "execution: $execution"
          sleep 20  # logs arrive a little after the run
          gcloud logging read "resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\" AND jsonPayload.event=\"probe\"" \
            --limit 5 --format=json | jq -c '.[].jsonPayload'
