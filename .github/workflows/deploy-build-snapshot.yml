# Builds the build-snapshot image and rolls it out to its job. The job itself is created
# by Terraform (bootstrap.sh --cycle) and run by the daily cycle, not here.
name: deploy-build-snapshot

on:
  push:
    branches: [main]
    paths: ["packages/lc_publish/**", "packages/lc_core/**", "packages/lc_directory/**", "services/build_snapshot/Dockerfile", ".github/workflows/deploy-build-snapshot.yml", "config/sources.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-build-snapshot
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lei-commons/build-snapshot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f services/build_snapshot/Dockerfile -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
      - name: Roll out, if the job exists
        run: |
          if gcloud run jobs describe build-snapshot --region "${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            gcloud run jobs update build-snapshot --region "${{ vars.GCP_REGION }}" --image "$IMAGE:$GITHUB_SHA" --task-timeout 7200s
          else
            echo "::notice::build-snapshot doesn't exist yet; the image is pushed"
          fi
