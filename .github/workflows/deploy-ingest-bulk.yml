# Builds the shared image for national registers published as bulk files (lc_ingest.bulk) and deploys
# one job per source that uses it in config/sources.yaml (pipeline.image: ingest-bulk), each told its
# source by LC_SOURCE. The daily cycle runs them; each also runs once now. While the system is paused, or
# a source isn't approved, every run stops at its first check.
name: deploy-ingest-bulk

on:
  push:
    branches: [main]
    paths: ["services/ingest_bulk/**", "packages/lc_ingest/**", "packages/lc_core/**", "config/fields.yaml", ".github/workflows/deploy-ingest-bulk.yml", "config/sources.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ingest-bulk
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lei-commons/ingest-bulk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The jobs, from the sources registry
        run: |
          pip install -q pyyaml
          python3 - <<'PY' > jobs.txt
          import yaml
          for s in yaml.safe_load(open("config/sources.yaml"))["sources"]:
              p = s.get("pipeline") or {}
              if p.get("image") == "ingest-bulk":
                  print(p["job"], s["id"])
          PY
          cat jobs.txt
          [ -s jobs.txt ] || { echo "::error::no source uses ingest-bulk"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f services/ingest_bulk/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy the jobs
        run: |
          GATEWAY="$(gcloud run services describe conduct-gateway --region "$REGION" --format='value(status.url)')"
          while read -r job source; do
            gcloud run jobs describe "$job" --region "$REGION" >/dev/null 2>&1 || echo "$job" >> new_jobs.txt
            gcloud run jobs deploy "$job" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" \
              --service-account "lc-ingest@$PROJECT.iam.gserviceaccount.com" \
              --network lc-jobs --subnet "lc-jobs-$REGION" --vpc-egress all-traffic \
              --set-env-vars "LC_SOURCE=$source,LC_GATEWAY_URL=$GATEWAY,LC_DATA_BUCKET=$PROJECT-data,LC_CONTROL_STATE_URI=gs://$PROJECT-control/state.json" \
              --max-retries 0 --task-timeout 10800 --memory 8Gi --cpu 2
          done < jobs.txt
      # Only a job this deploy created runs now (its first run); the daily cycle runs the others, one at a time.
      - name: Run each new job once now
        run: |
          [ -s new_jobs.txt ] || { echo "no new jobs"; exit 0; }
          while read -r job; do
            grep -q "^$job .* fallback$" jobs.txt && continue  # a fallback runs only when the cycle needs it
            gcloud run jobs execute "$job" --region "$REGION" --async
          done < new_jobs.txt
