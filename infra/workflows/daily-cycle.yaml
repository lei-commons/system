# GENERATED by scripts/render_cycle.py from config/sources.yaml, config/cycle.yaml, config/dedi.yaml and the
# approved browser fallbacks (config/egress-allowlist.yaml). Don't edit:
# change those and run the script. Deployed by Terraform (infra/terraform/cycle.tf) and by
# .github/workflows/deploy-cycle.yml, which deploy this same file.
main:
  steps:
  - init:
      assign:
      - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
      - region: us-central1
      - sources:
        - ingest-gleif
        - ingest-gb
        - ingest-ny
        - ingest-co
        - ingest-or
        - ingest-ct
        - ingest-br
        - ingest-sg
        - ingest-fi
        - ingest-ie
        - ingest-au
        - ingest-jp
        - ingest-ca
      - failed: []
      - fallbacks:
          ingest-ie: ingest-ie-browser
          ingest-au: ingest-au-browser
  - first_try:
      for:
        value: job
        in: ${sources}
        steps:
        - first_run:
            try:
              call: googleapis.run.v2.projects.locations.jobs.run
              args:
                name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
                connector_params:
                  timeout: 7200
            except:
              as: e
              steps:
              - first_note_failure:
                  assign:
                  - failed: ${list.concat(failed, job)}
              - first_log_failure:
                  call: sys.log
                  args:
                    severity: WARNING
                    json:
                      event: source-failed
                      job: ${job}
                      round: ${0}
                      error: ${e}
  - retry_rounds:
      for:
        value: retry_round
        range:
        - 1
        - 5
        steps:
        - all_done:
            switch:
            - condition: ${len(failed) == 0}
              next: break
        - wait:
            call: sys.sleep
            args:
              seconds: 600
        - take_failed:
            assign:
            - trying: ${failed}
            - failed: []
        - retry_each:
            for:
              value: job
              in: ${trying}
              steps:
              - retry_run:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                      name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
                      connector_params:
                        timeout: 7200
                  except:
                    as: e
                    steps:
                    - retry_note_failure:
                        assign:
                        - failed: ${list.concat(failed, job)}
                    - retry_log_failure:
                        call: sys.log
                        args:
                          severity: WARNING
                          json:
                            event: source-failed
                            job: ${job}
                            round: ${retry_round}
                            error: ${e}
  - browser_fallbacks:
      steps:
      - take_still_failing:
          assign:
          - trying: ${failed}
          - failed: []
      - fallback_each:
          for:
            value: job
            in: ${trying}
            steps:
            - has_fallback:
                switch:
                - condition: ${job in fallbacks}
                  next: fallback_run
                next: no_fallback
            - no_fallback:
                assign:
                - failed: ${list.concat(failed, job)}
                next: continue
            - fallback_run:
                try:
                  steps:
                  - fallback_job:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${"projects/" + project + "/locations/" + region + "/jobs/" + fallbacks[job]}
                        connector_params:
                          timeout: 7200
                  - fallback_log:
                      call: sys.log
                      args:
                        severity: WARNING
                        json:
                          event: source-recovered-by-browser
                          job: ${job}
                except:
                  as: e
                  steps:
                  - fallback_note_failure:
                      assign:
                      - failed: ${list.concat(failed, job)}
                  - fallback_log_failure:
                      call: sys.log
                      args:
                        severity: WARNING
                        json:
                          event: browser-fallback-failed
                          job: ${job}
                          error: ${e}
  - build_snapshot:
      call: googleapis.run.v2.projects.locations.jobs.run
      args:
        name: ${"projects/" + project + "/locations/" + region + "/jobs/" + "build-snapshot"}
        connector_params:
          timeout: 10800
  - load_db:
      call: googleapis.run.v2.projects.locations.jobs.run
      args:
        name: ${"projects/" + project + "/locations/" + region + "/jobs/" + "load-db"}
        connector_params:
          timeout: 7200
  - dedi_check:
      try:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + "dedi-check"}
          connector_params:
            timeout: 7200
      except:
        as: e
        steps:
        - dedi_check_failed:
            call: sys.log
            args:
              severity: WARNING
              json:
                event: dedi-check-failed
                error: ${e}
  - trials:
      for:
        value: job
        in:
        - ingest-au-abn
        - ingest-us-irs
        - ingest-fr-rna
        - ingest-ar
        - ingest-gb-ccew
        - ingest-tw-tax
        steps:
        - trial_run:
            try:
              call: googleapis.run.v2.projects.locations.jobs.run
              args:
                name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
                connector_params:
                  timeout: 7200
            except:
              as: e
              steps:
              - trial_log_failure:
                  call: sys.log
                  args:
                    severity: WARNING
                    json:
                      event: trial-failed
                      job: ${job}
                      error: ${e}
  - report:
      switch:
      - condition: ${len(failed) > 0}
        steps:
        - fail:
            raise:
              code: sources-failed
              message: sources still failing after 5 retries (the snapshot and load ran without their new data)
              failed: ${failed}
  - done:
      return:
        sources: ${sources}
        failed: ${failed}
