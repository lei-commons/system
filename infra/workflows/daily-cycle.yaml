# GENERATED by scripts/render_cycle.py from config/sources.yaml and config/cycle.yaml. Don't edit:
# change those and run the script. Deployed by Terraform (infra/terraform/cycle.tf) and by
# .github/workflows/deploy-cycle.yml, which deploy this same file.
main:
  steps:
  - init:
      assign:
      - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
      - region: us-central1
      - sources:
        - ingest-gleif
        - ingest-gb
        - ingest-ny
        - ingest-co
        - ingest-or
        - ingest-ct
        - ingest-br
        - ingest-sg
        - ingest-fi
        - ingest-ie
        - ingest-au
        - ingest-jp
        - ingest-ca
      - failed: []
  - first_try:
      for:
        value: job
        in: ${sources}
        steps:
        - first_run:
            try:
              call: googleapis.run.v2.projects.locations.jobs.run
              args:
                name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
                connector_params:
                  timeout: 7200
            except:
              as: e
              steps:
              - first_note_failure:
                  assign:
                  - failed: ${list.concat(failed, job)}
              - first_log_failure:
                  call: sys.log
                  args:
                    severity: WARNING
                    json:
                      event: source-failed
                      job: ${job}
                      round: ${0}
                      error: ${e}
  - retry_rounds:
      for:
        value: retry_round
        range:
        - 1
        - 5
        steps:
        - all_done:
            switch:
            - condition: ${len(failed) == 0}
              next: break
        - wait:
            call: sys.sleep
            args:
              seconds: 600
        - take_failed:
            assign:
            - trying: ${failed}
            - failed: []
        - retry_each:
            for:
              value: job
              in: ${trying}
              steps:
              - retry_run:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                      name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
                      connector_params:
                        timeout: 7200
                  except:
                    as: e
                    steps:
                    - retry_note_failure:
                        assign:
                        - failed: ${list.concat(failed, job)}
                    - retry_log_failure:
                        call: sys.log
                        args:
                          severity: WARNING
                          json:
                            event: source-failed
                            job: ${job}
                            round: ${retry_round}
                            error: ${e}
  - build_snapshot:
      call: googleapis.run.v2.projects.locations.jobs.run
      args:
        name: ${"projects/" + project + "/locations/" + region + "/jobs/" + "build-snapshot"}
        connector_params:
          timeout: 7200
  - load_db:
      call: googleapis.run.v2.projects.locations.jobs.run
      args:
        name: ${"projects/" + project + "/locations/" + region + "/jobs/" + "load-db"}
        connector_params:
          timeout: 7200
  - report:
      switch:
      - condition: ${len(failed) > 0}
        steps:
        - fail:
            raise:
              code: sources-failed
              message: sources still failing after 5 retries (the snapshot and load ran without their new data)
              failed: ${failed}
  - done:
      return:
        sources: ${sources}
        failed: ${failed}
